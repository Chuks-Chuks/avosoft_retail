version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ddl:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file: .env  # This loads ALL variables from the .env file
    command: >
      bash -c "
      python -m avosoft_engine.cli --date $${SIM_DATE:-2025-08-27}
      "
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - ./.env:/app/.env  # Mount the .env file
    working_dir: /app

  airflow:
    image: apache/airflow:2.9.2
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      PYTHONWARNINGS: "ignore::SyntaxWarning:azure.synapse.artifacts.models._models_py3"
    volumes:
      - ./avosoft_engine/pipelines/airflow/dags:/opt/airflow/dags
      - ./avosoft_engine/pipelines/airflow/logs:/opt/airflow/logs
      - ./avosoft_engine/pipelines/airflow/plugins:/opt/airflow/plugins
      - airflow_data:/opt/airflow
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: 
      - bash
      - -c
      - |
        sleep 10
        if ! airflow db check >/dev/null 2>&1; then
          echo "Initializing Airflow database..."
          airflow db init
          airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
          echo "Airflow database initialized successfully"
        else
          echo "Airflow database already initialized"
        fi
        echo "Starting Airflow services..."
        airflow webserver &
        airflow scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  airflow_data: